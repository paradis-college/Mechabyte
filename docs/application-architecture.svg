<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Mechabyte website architecture</title>
  <desc id="desc">Vite builds a Vue 3 TypeScript single-page application. Vue Router selects team, portfolio, outreach, sponsors and contact views; shared components and bilingual translation data feed the rendered interface, including p5.js creative elements.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f2"/><stop offset="1" stop-color="#e4eee6"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3428" flood-opacity=".13"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#32734d"/></marker></defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#173b28">Mechabyte website architecture</text>
  <text x="60" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#546b5d">Vue 3 + TypeScript single-page application for FTC team communication</text>
  <g filter="url(#s)"><rect x="55" y="180" width="210" height="235" rx="22" fill="#fff" stroke="#bdd0c2" stroke-width="2"/><rect x="330" y="145" width="260" height="305" rx="22" fill="#fff" stroke="#bdd0c2" stroke-width="2"/><rect x="655" y="145" width="260" height="305" rx="22" fill="#fff" stroke="#bdd0c2" stroke-width="2"/><rect x="980" y="180" width="165" height="235" rx="22" fill="#fff" stroke="#bdd0c2" stroke-width="2"/></g>
  <text x="160" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#24543a">Vite</text><text x="160" y="272" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Development server</text><text x="160" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Vue SFC compilation</text><text x="160" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">TypeScript build</text><text x="160" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">dist/ output</text>
  <text x="460" y="195" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#24543a">Vue application</text><text x="460" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">App.vue shell</text><text x="460" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Vue Router history mode</text><text x="460" y="298" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Home / Team / Portfolio</text><text x="460" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Outreach / Sponsors / Contact</text><text x="460" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Scroll and interaction state</text><text x="460" y="388" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Responsive layout</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#24543a">Shared modules</text><text x="785" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Reusable components</text><text x="785" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">English / Romanian data</text><text x="785" y="298" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Team and portfolio content</text><text x="785" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">CSS variables and scoped styles</text><text x="785" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">p5.js creative visuals</text><text x="785" y="388" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Public media assets</text>
  <text x="1062" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#24543a">Browser</text><text x="1062" y="272" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Client-side routes</text><text x="1062" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Animations</text><text x="1062" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Bilingual UI</text><text x="1062" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5b6e61">Team content</text>
  <line x1="265" y1="297" x2="320" y2="297" stroke="#32734d" stroke-width="4" marker-end="url(#a)"/><line x1="590" y1="297" x2="645" y2="297" stroke="#32734d" stroke-width="4" marker-end="url(#a)"/><line x1="915" y1="297" x2="970" y2="297" stroke="#32734d" stroke-width="4" marker-end="url(#a)"/>
  <rect x="250" y="505" width="700" height="62" rx="20" fill="#d5e7d9"/><text x="600" y="531" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#24543a">Production hosting must rewrite unknown paths to index.html</text><text x="600" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#51685a">Vue Router uses createWebHistory(), so direct visits such as /portfolio require SPA fallback configuration</text>
</svg>